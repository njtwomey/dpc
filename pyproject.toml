[project]
name = "dpc"
version = "0.1.0"
description = "Scrape dpchallenge.com user-awarded 'bling' and build a static gallery site"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Niall Twomey" }]

dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
dpc = "dpc.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E", "W",   # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",   # allow typing.Any where it is genuinely the right type
    "E501",     # line length is handled by the formatter
    "TRY003",   # long messages outside exception classes are fine here
    "PLR0913",  # parser constructors legitimately take many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "PLR2004"]  # asserts and magic numbers are the point
"scripts/**" = ["T20"]                       # one-shot scripts may print

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["dpc"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["bs4.*", "slugify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: tests that hit the filesystem or a real database"]
