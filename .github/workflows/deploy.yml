name: deploy

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Publishes to GitHub Pages from this repository. Set Settings -> Pages ->
# Source to "GitHub Actions" for this to take effect.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Fail early if the export is missing
        run: |
          if [ ! -f site/data/dpc/meta.json ]; then
            echo "::error::site/data/dpc/meta.json is missing."
            echo "Run 'dpc export' locally and commit site/data/dpc/*.json."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
