{{ define "main" }}

<div class="columns is-multiline">
  <div class="column is-8 is-offset-2 has-text-centered">
    <p class="title is-1">
      {{ .Title }}
    </p>
  </div>
</div>

<div class="columns is-flex is-multiline is-centered">
  {{ range .Page.Params.users }}
  {{ partial "user_card.html" (dict "name" .name "slug" .slug "thumb" .thumb "extra" .description) }}
  {{ end }}
</div>

{{ end }}
