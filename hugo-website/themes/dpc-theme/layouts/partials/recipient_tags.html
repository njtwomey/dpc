{{ $all_awards := .all_awards }}
<div class="field is-grouped is-grouped-multiline is-centered is-hcentred">
    {{ range $award_count := .award_counts }}
    {{ $award := index $all_awards $award_count.slug }}
    <div class="control">
        <div class="tags has-addons">
            <span class="tag">
                {{ $tag_url := printf "awarders/%s/%s" $award.awarder_slug $award.slug}}
                <a href="{{ $tag_url | absURL }}">{{ $award.name | title }}</a>
            </span>
            <span class="tag is-dark">{{ $award_count.count }}</span>
        </div>
    </div>
    {{ end }}
</div>
