
{{ $all_awards := .Site.Data.collections.awards_meta }}
{{ $images := .images }}
<div class="columns is-multiline">
    {{ range .image_ids }}
        {{ $image := index $images (printf "%d" .) }}
        <div class="column is-2">
            <div class="card">
                <div class="card-content">
                    <div class="content">
                        <figure class="image is-3by2">
                            <a href="{{ $image.image_url }}" 
                               class="fresco" 
                               data-fresco-group="dpc"
                               data-fresco-caption="<a href='{{ $image.image_webpage }}'>{{ $image.image_title | htmlUnescape }} <i class='fa fa-external-link-alt' style='font-size:12px'></i></a> &middot; <a href='{{ $image.user_webpage }}'>{{ $image.user_name | htmlUnescape }} <i class='fa fa-external-link-alt' style='font-size:12px'></i></a> &middot; <a href='{{ $image.challenge_webpage }}'>{{ $image.challenge_name | htmlUnescape }} <i class='fa fa-external-link-alt' style='font-size:12px'></i></a> {{ range $image.awards }} &middot; {{ . }}{{ end }}">
                            <img src="{{ $image.image_thumb_url }}" loading="lazy" alt="{{ $image.name }}">
                            </a>
                        </figure>
                    </div>
                </div>
                <footer class="card-footer">
                    <a class="card-footer-item" href='{{ $image.user_webpage }}'>{{ $image.user_name | htmlUnescape }}&nbsp;<i class="fa fa-external-link-alt" style="font-size:12px"></i></a>
                </footer>
            </div>
        </div>
    {{ end }}
</div>
