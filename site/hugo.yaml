baseURL: https://www.nialltwomey.com/dpc/
title: DPChallenge Award Gallery
defaultContentLanguage: en

languages:
  en:
    locale: en-uk

# Every page below /awarders, /challenges and /recipients is generated from
# data/dpc/*.json by the content adapters in content/*/_content.gotmpl.
# Nothing under content/ is machine-written.

# No tags or categories on this site; without this Hugo asks for taxonomy layouts.
disableKinds:
  - taxonomy
  - term

params:
  authorName: Niall Twomey
  description: An interface for the user-generated awards given at https://www.dpchallenge.com

menus:
  main:
    - name: Awarders
      url: /awarders
      weight: 10
    - name: Recipients
      url: /recipients
      weight: 20
    - name: Challenges
      url: /challenges
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
